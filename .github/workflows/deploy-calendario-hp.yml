name: Deploy Calendario HP to GitHub Pages

on:
  push:
    branches:
      - NAVIDAD26
    paths:
      - "CalendarioAdvientoHP/**"
      - ".github/workflows/deploy-calendario-hp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-calendario-hp"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload calendar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: CalendarioAdvientoHP

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
